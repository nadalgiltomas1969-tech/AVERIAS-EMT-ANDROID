name: Compilar APK AVERIAS EMT

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Localizar y descomprimir proyecto
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encuentra ningún archivo ZIP en el repositorio."
            exit 1
          fi
          echo "Proyecto encontrado: $ZIP"
          mkdir -p proyecto
          unzip -o "$ZIP" -d proyecto

      - name: Localizar proyecto Android
        id: android
        run: |
          GRADLE=$(find proyecto -type f -name "settings.gradle*" | head -n 1)
          if [ -z "$GRADLE" ]; then
            echo "ERROR: No se encuentra settings.gradle ni settings.gradle.kts."
            exit 1
          fi
          DIR=$(dirname "$GRADLE")
          echo "Proyecto Android localizado en: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        working-directory: ${{ steps.android.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Localizar APK
        id: apk
        run: |
          APK=$(find proyecto -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: La compilación terminó sin encontrar ningún APK."
            exit 1
          fi
          echo "APK generado: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AVERIAS-EMT-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
